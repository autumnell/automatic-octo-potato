# Builds the card picture gallery (every paper printing's fingerprint) and keeps it on the "models" release as
# card-gallery.bin; the app build puts it in the APK, so the scanner knows every card by its picture from the
# first open. Runs daily to add new cards (the phone also adds them itself, on Wi-Fi).
name: Card gallery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    paths:
      - .github/workflows/gallery.yml
      - .github/scripts/build_gallery.py

permissions:
  contents: write

concurrency:
  group: card-gallery
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q onnxruntime pillow numpy
      - name: Models and the last gallery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p g
          HF=https://huggingface.co
          curl -fsSL --retry 4 -o g/card.onnx "$HF/dhvazquez/mtg_card_identification_embeddings/resolve/main/20260521-044732/onnx/mtg_embed_fp16.onnx"
          if gh release download models -p card-gallery.bin -D g --clobber; then
            echo "Starting from the last gallery."
          else
            echo "No gallery yet: starting from the published one."
            curl -fsSL --retry 4 -o g/gallery_f16.bin "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/gallery_f16.bin"
            curl -fsSL --retry 4 -o g/gallery_ids.json "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/gallery_ids.json"
            curl -fsSL --retry 4 -o g/meta.json "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/meta.json"
          fi
      - name: Add missing printings
        run: python .github/scripts/build_gallery.py g g/card-gallery.bin g/new.bin 25000
      - name: Publish to the models release
        # Only main publishes: every app build ships this file, so a branch must not replace it.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l g/new.bin
          cp g/new.bin card-gallery.bin
          gh release view models >/dev/null 2>&1 || gh release create models --prerelease --latest=false \
            --title "Scan models" --notes "Optional model files the app downloads. Not an app build."
          gh release upload models card-gallery.bin --clobber
