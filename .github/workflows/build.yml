name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mtg-scanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Every build of main replaces the "latest" release, so the newest APK
      # is always one tap away from a phone's browser.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mtg-scanner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mtg-scanner.apk \
            --title "MTG Scanner (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download mtg-scanner.apk on your phone and open it to install."
