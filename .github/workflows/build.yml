name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # A release build (R8, no debugging): much faster on the phone. Signed with the same
      # committed key and same app id as the old debug builds, so it installs over them.
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mtg-scanner-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Every build of main replaces the "latest" release, so the newest APK
      # is always one tap away from a phone's browser.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk mtg-scanner.apk
          gh release delete latest --yes --cleanup-tag || true
          BUILD_DATE="$(date -u '+%b %-d')"
          gh release create latest mtg-scanner.apk \
            --title "Grimoire build ${GITHUB_RUN_NUMBER} · ${BUILD_DATE}" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}, ${BUILD_DATE}. Download mtg-scanner.apk on your phone and open it to install."
