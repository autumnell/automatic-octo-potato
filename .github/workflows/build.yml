name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to a pull request cancels its older run. Builds of main are never cancelled midway (one
# could stop between deleting and re-creating the "latest" release); a newer push waits its turn instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Optional private signing key. Only used when the RELEASE_KEYSTORE_BASE64 secret is set (plus
      # RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD); otherwise the build uses the
      # committed key in keystore/ as before. Switching keys means one uninstall on the phone.
      - name: Release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the private release key."
          else
            echo "No release key secret: signing with the committed key."
          fi

      # A release build (R8, no debugging): much faster on the phone. Same app id as the old debug
      # builds, and the same committed key unless the private key above is set.
      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK
        # A full artifact store (GitHub's storage quota) mustn't fail the build or stop the release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mtg-scanner-apk
          retention-days: 7
          path: app/build/outputs/apk/release/app-release.apk

      # R8 renames classes in release builds; this file turns a crash report's stack trace back into
      # readable names (retrace). Each build's own copy is also attached to its release below.
      - name: Upload R8 mapping
        # A full artifact store (GitHub's storage quota) mustn't fail the build or stop the release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mtg-scanner-mapping
          retention-days: 7
          path: app/build/outputs/mapping/release/mapping.txt

      # Every build of main replaces the "latest" release, so the newest APK is always one tap away from
      # a phone's browser (same tag, same asset name). Each build also gets its own release, build-N, kept
      # so an older build can be reinstalled. build-N is created first and marked not-latest, so GitHub's
      # "Latest" badge stays on the "latest" release.
      - name: Publish releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk mtg-scanner.apk
          cp app/build/outputs/mapping/release/mapping.txt mapping.txt
          BUILD_DATE="$(date -u '+%b %-d')"
          TITLE="Grimoire build ${GITHUB_RUN_NUMBER} · ${BUILD_DATE}"
          TAG="build-${GITHUB_RUN_NUMBER}"

          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" mtg-scanner.apk mapping.txt \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "$TITLE" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}, ${BUILD_DATE}. To go back to this build, download mtg-scanner.apk on your phone and open it. mapping.txt reads this build's crash reports."

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mtg-scanner.apk mapping.txt \
            --target "$GITHUB_SHA" \
            --latest \
            --title "$TITLE" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}, ${BUILD_DATE}. Download mtg-scanner.apk on your phone and open it to install."

  # Lint compiles its own debug build, so it runs as a job of its own, beside the build instead of after it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Android lint, mainly for calls to APIs newer than Android 8 (minSdk 26). It reports but doesn't
      # fail the build yet (abortOnError = false in app/build.gradle.kts).
      - name: Android lint
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintDebug
          REPORT=app/build/reports/lint-results-debug.xml
          if [ -f "$REPORT" ]; then
            ERRORS=$(grep -c 'severity="Error"' "$REPORT" || true)
            WARNINGS=$(grep -c 'severity="Warning"' "$REPORT" || true)
            NEWAPI=$(grep -c 'id="NewApi"' "$REPORT" || true)
            {
              echo "### Android lint"
              echo "- Errors: ${ERRORS}"
              echo "- Warnings: ${WARNINGS}"
              echo "- NewApi (newer than Android 8): ${NEWAPI}"
              echo "Full report: the lint-report artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lint report
        # A full artifact store (GitHub's storage quota) mustn't fail the build or stop the release.
        continue-on-error: true
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          retention-days: 7
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  # How well cards are known by their picture (ScanAccuracyTest), with the real models and gallery of every printing
  # and Scryfall pictures of 60 random cards. The models and gallery are kept in the cache between runs.
  scan-accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache models and gallery
        uses: actions/cache@v4
        with:
          path: scan-models
          key: scan-models-v1

      # A download that fails leaves the test to skip itself rather than failing the build.
      - name: Download models, gallery and sample cards
        continue-on-error: true
        run: |
          mkdir -p scan-models/samples
          cd scan-models
          HF=https://huggingface.co
          get() { [ -s "$2" ] || curl -fsSL --retry 4 -o "$2" "$1"; }
          get "$HF/dhvazquez/mtg_card_identification_embeddings/resolve/main/20260521-044732/onnx/mtg_embed_fp16.onnx" card.onnx
          get "$HF/dhvazquez/mtg_card_pose_estimation/resolve/main/exports/mtg_4kp_s_r4b_fp16.onnx" corners.onnx
          get "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/gallery_f16.bin" gallery_f16.bin
          get "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/gallery_ids.json" gallery_ids.json
          get "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/meta.json" meta.json
          # 60 random printings, a new pick each run: Scryfall's normal-size picture of each.
          rm -f samples/*
          python3 -c "import json,random; ids=json.load(open('gallery_ids.json')); print('\n'.join(random.sample(ids, 60)))" > pick.txt
          while read -r id; do
            curl -fsSL -A "GrimoireScanTest/1.0" -H "Accept: */*" -o "samples/$id.jpg" "https://api.scryfall.com/cards/$id?format=image&version=normal" || rm -f "samples/$id.jpg"
            sleep 0.12
          done < pick.txt
          ls samples | wc -l

      - name: Run the accuracy test
        env:
          SCAN_MODELS: ${{ github.workspace }}/scan-models
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.mtgscanner.scan.ScanAccuracyTest'

      - name: Report
        if: always()
        run: cat app/build/scan-accuracy.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report (test skipped)" >> "$GITHUB_STEP_SUMMARY"
