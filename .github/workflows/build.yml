name: Build app

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to a pull request cancels its older run. Builds of main are never cancelled midway (one
# could stop between deleting and re-creating the "latest" release); a newer push waits its turn instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions minutes are limited, so each job runs only when it can tell us something new:
# - a pull request that only changes docs (design/, *.md) runs nothing;
# - the release APK (R8, several minutes) is built for main and for pull requests marked ready, not for drafts;
# - screen pictures run when a pull request changes the UI; the accuracy test when it changes scanning;
# - a push to main only builds and publishes: its pull request already ran the rest.
# Lint and the model comparison only report, so they live in checks.yml (weekly and by hand).
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.f.outputs.code }}
      ui: ${{ steps.f.outputs.ui }}
      scan: ${{ steps.f.outputs.scan }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            printf 'code=true\nui=true\nscan=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/$PR/files" --paginate -q '.[].filename' > files.txt
          cat files.txt
          shared='^(\.github/workflows/build\.yml|app/build\.gradle\.kts|build\.gradle\.kts|settings\.gradle\.kts|gradle/)'
          has() { grep -qE "$1" files.txt && echo true || echo false; }
          echo "code=$(grep -qvE '^design/|\.md$' files.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ui=$(has "$shared|^app/src/main/res/|^app/src/main/java/com/mtgscanner/(ui/|MainActivity)|^app/src/test/java/com/mtgscanner/screens/")" >> "$GITHUB_OUTPUT"
          echo "scan=$(has "$shared|^app/src/main/java/com/mtgscanner/scan/|^app/src/main/assets/|^app/src/test/java/com/mtgscanner/scan/|^app/src/test/resources/scan-photos/|^\.github/scripts/")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Drafts get tests only; main, ready pull requests and manual runs also build the release APK.
      FULL: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Every database version's layout must be in app/schemas, so the upgrade test (UpgradeTest) can start from it.
      - name: Database layout is saved
        run: |
          git add -N app/schemas
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            echo "::error::The database layout changed. Commit the new file in app/schemas (it's written by the build)."
            exit 1
          fi

      - name: Big-collection timing
        if: always()
        run: cat app/build/big-collection.md 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || echo "No timing report"

      # Optional private signing key. Only used when the RELEASE_KEYSTORE_BASE64 secret is set (plus
      # RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD); otherwise the build uses the
      # committed key in keystore/ as before. Switching keys means one uninstall on the phone.
      - name: Release signing key
        if: env.FULL == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the private release key."
          else
            echo "No release key secret: signing with the committed key."
          fi

      # The optional YOLO card finder goes in the APK (Settings › Data › Card finder): the repository is private,
      # so the phone can't download it from the "models" release. A build without it still works.
      - name: YOLO card finder
        if: env.FULL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          gh release download models -p card-finder-yolo11n-obb.onnx -D app/src/main/assets --clobber \
            || echo "No YOLO file on the models release: the build leaves it out."

      # Every printing's picture fingerprint (built daily by gallery.yml), so the scanner knows every card from the
      # first open. Without it the phone downloads the published gallery and fills the gaps itself.
      - name: Card gallery
        if: env.FULL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models -p card-gallery.bin -D app/src/main/assets --clobber \
            || echo "No card gallery on the models release: the build leaves it out."

      # Commander Spellbook's combos as a small list (built weekly by combos.yml), for "Combos you could build".
      # Without it the phone downloads the list from the "models" release.
      - name: Combo list
        if: env.FULL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models -p combos.tsv.gz -D app/src/main/assets --clobber \
            || echo "No combo list on the models release: the build leaves it out."
          gh release download models -p bracket-tags.json -D app/src/main/assets --clobber \
            || echo "No bracket tag lists on the models release: the bracket check reads card text instead."

      # A release build (R8, no debugging): much faster on the phone. Same app id as the old debug
      # builds, and the same committed key unless the private key above is set.
      - name: Build APK
        if: env.FULL == 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK
        if: env.FULL == 'true'
        # A full artifact store (GitHub's storage quota) mustn't fail the build or stop the release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mtg-scanner-apk
          retention-days: 7
          path: app/build/outputs/apk/release/app-release.apk

      # R8 renames classes in release builds; this file turns a crash report's stack trace back into
      # readable names (retrace). Each build's own copy is also attached to its release below.
      - name: Upload R8 mapping
        if: env.FULL == 'true'
        # A full artifact store (GitHub's storage quota) mustn't fail the build or stop the release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mtg-scanner-mapping
          retention-days: 7
          path: app/build/outputs/mapping/release/mapping.txt

      # Every build of main replaces the "latest" release, so the newest APK is always one tap away from
      # a phone's browser (same tag, same asset name). Each build also gets its own release, build-N, kept
      # so an older build can be reinstalled. build-N is created first and marked not-latest, so GitHub's
      # "Latest" badge stays on the "latest" release.
      - name: Publish releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk mtg-scanner.apk
          cp app/build/outputs/mapping/release/mapping.txt mapping.txt
          BUILD_DATE="$(date -u '+%b %-d')"
          TITLE="Grimoire build ${GITHUB_RUN_NUMBER} · ${BUILD_DATE}"
          TAG="build-${GITHUB_RUN_NUMBER}"

          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" mtg-scanner.apk mapping.txt \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "$TITLE" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}, ${BUILD_DATE}. To go back to this build, download mtg-scanner.apk on your phone and open it. mapping.txt reads this build's crash reports."

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mtg-scanner.apk mapping.txt \
            --target "$GITHUB_SHA" \
            --latest \
            --title "$TITLE" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}, ${BUILD_DATE}. Download mtg-scanner.apk on your phone and open it to install."

  # Pictures of the main screens with a sample collection (ScreenPicturesTest), in dark, light and large text. They go
  # on the "screens" branch, one folder per branch, and a pull request gets a comment showing them.
  screens:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Draw the screens
        env:
          SCREEN_PICTURES: "1"
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.mtgscanner.screens.ScreenPicturesTest'

      - name: Publish the pictures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ls app/build/screens/*.png >/dev/null 2>&1 || { echo "No pictures"; exit 0; }
          dir="$(echo "$BRANCH" | tr '/' '-')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            rm -rf /tmp/screens
            if git fetch -q origin screens; then
              git worktree add -f /tmp/screens FETCH_HEAD
              (cd /tmp/screens && git checkout -q -B screens)
            else
              git worktree add -f --detach /tmp/screens
              (cd /tmp/screens && git checkout -q --orphan screens && git rm -rfq .)
            fi
            rm -rf "/tmp/screens/$dir" && mkdir -p "/tmp/screens/$dir"
            cp app/build/screens/*.png "/tmp/screens/$dir/"
            (cd /tmp/screens && git add -A && { git diff --cached --quiet || git commit -qm "Screens for $BRANCH at ${GITHUB_SHA::7}"; } && git push -q origin screens) && break
            git worktree remove -f /tmp/screens
            sleep $((attempt * 5))
          done
          sha=$(git -C /tmp/screens rev-parse HEAD)
          [ -n "$PR" ] || exit 0
          base="https://github.com/${GITHUB_REPOSITORY}/blob/$sha/$dir"
          {
            echo "<!-- screen-pictures -->"
            echo "### Screens at ${GITHUB_SHA::7}"
            echo
            echo "| Screen | Dark | Light | Large text |"
            echo "|---|---|---|---|"
            for f in app/build/screens/*-dark.png; do
              n=$(basename "$f" -dark.png)
              echo "| $n | <img src=\"$base/$n-dark.png?raw=true\" width=\"180\"> | <img src=\"$base/$n-light.png?raw=true\" width=\"180\"> | <img src=\"$base/$n-large.png?raw=true\" width=\"180\"> |"
            done
          } > /tmp/comment.md
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- screen-pictures -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$id" -F body=@/tmp/comment.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/$PR/comments" -F body=@/tmp/comment.md >/dev/null
          fi

  # How well cards are known by their picture (ScanAccuracyTest), with the real models and gallery of every printing
  # and Scryfall pictures of 60 random cards. The models and gallery are kept in the cache between runs.
  scan-accuracy:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache models and gallery
        uses: actions/cache@v4
        with:
          path: |
            scan-models/*.onnx
            scan-models/*.bin
            scan-models/*.json
          key: scan-models-v1

      # A download that fails leaves the test to skip itself rather than failing the build.
      - name: Download models, gallery and sample cards
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pillow numpy
          mkdir -p scan-models
          HF=https://huggingface.co
          get() { [ -s "scan-models/$2" ] || curl -fsSL --retry 4 -o "scan-models/$2" "$1"; }
          get "$HF/dhvazquez/mtg_card_identification_embeddings/resolve/main/20260521-044732/onnx/mtg_embed_fp16.onnx" card.onnx
          get "$HF/dhvazquez/mtg_card_pose_estimation/resolve/main/exports/mtg_4kp_s_r4b_fp16.onnx" corners.onnx
          get "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/gallery_f16.bin" gallery_f16.bin
          get "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/gallery_ids.json" gallery_ids.json
          get "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/meta.json" meta.json
          python3 .github/scripts/scan_samples.py scan-models 40 app/src/test/resources/scan-photos
          # The gallery that goes in the app, when there is one (not cached: it changes daily).
          gh release download models -p card-gallery.bin -D scan-models --clobber || rm -f scan-models/card-gallery.bin

      - name: Run the accuracy test
        env:
          SCAN_MODELS: ${{ github.workspace }}/scan-models
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.mtgscanner.scan.ScanAccuracyTest'

      - name: Report
        if: always()
        run: |
          cat app/build/scan-accuracy.md 2>/dev/null || echo "No report (test skipped)"
          cat app/build/scan-accuracy.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report (test skipped)" >> "$GITHUB_STEP_SUMMARY"

      # The worst misses side by side, and the phone-photo correction the test fitted, to download from the run.
      - name: Pictures of the worst misses
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/miss_sheet.py

      # The fitted correction as text too, for places that can read the log but not download artifacts.
      - name: Correction as text
        if: always()
        continue-on-error: true
        run: |
          f=app/build/card-adapter.bin
          [ -f "$f" ] || { echo "No correction fitted"; exit 0; }
          sha256sum "$f"
          cmp -s "$f" app/src/main/assets/card-adapter.bin && echo "Same as the shipped correction" || echo "Differs from the shipped correction"
          gzip -9c "$f" | base64 -w 4000 | sed 's/^/ADAPTER64 /'

      - name: Upload misses and correction
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scan-accuracy
          retention-days: 7
          path: |
            app/build/scan-misses.png
            app/build/card-adapter.bin
            app/build/scan-accuracy.md
          if-no-files-found: ignore
