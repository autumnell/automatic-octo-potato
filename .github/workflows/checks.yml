name: Checks

# Reports that never block a merge, so they don't spend Actions minutes on every push: Android lint and the
# picture-model comparison. Weekly, and by hand from the Actions tab (Checks › Run workflow).
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Android lint. It only reports (abortOnError = false), so it runs weekly rather than on every push.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Android lint, mainly for calls to APIs newer than Android 8 (minSdk 26). It reports but doesn't
      # fail the build yet (abortOnError = false in app/build.gradle.kts).
      - name: Android lint
        continue-on-error: true
        run: |
          ./gradlew --no-daemon lintDebug
          REPORT=app/build/reports/lint-results-debug.xml
          if [ -f "$REPORT" ]; then
            ERRORS=$(grep -c 'severity="Error"' "$REPORT" || true)
            WARNINGS=$(grep -c 'severity="Warning"' "$REPORT" || true)
            NEWAPI=$(grep -c 'id="NewApi"' "$REPORT" || true)
            {
              echo "### Android lint"
              echo "- Errors: ${ERRORS}"
              echo "- Warnings: ${WARNINGS}"
              echo "- NewApi (newer than Android 8): ${NEWAPI}"
              echo "Full report: the lint-report artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload lint report
        # A full artifact store (GitHub's storage quota) mustn't fail the build or stop the release.
        continue-on-error: true
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          retention-days: 7
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  # Grimoire's card picture model and corner model against open-card-collector's DINOv3 Small embedder and
  # YOLO11n OBB detector, on the same sample pictures. Only reports; it never fails anything. It installs PyTorch.
  model-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache models and gallery
        uses: actions/cache@v4
        with:
          path: |
            scan-models/*.onnx
            scan-models/*.bin
            scan-models/*.json
          key: scan-models-v1

      - name: Install
        continue-on-error: true
        run: |
          pip install -q pillow numpy onnxruntime huggingface_hub
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.56" ultralytics

      - name: Download models and sample cards
        continue-on-error: true
        run: |
          mkdir -p scan-models
          HF=https://huggingface.co
          get() { [ -s "scan-models/$2" ] || curl -fsSL --retry 4 -o "scan-models/$2" "$1"; }
          get "$HF/dhvazquez/mtg_card_identification_embeddings/resolve/main/20260521-044732/onnx/mtg_embed_fp16.onnx" card.onnx
          get "$HF/dhvazquez/mtg_card_pose_estimation/resolve/main/exports/mtg_4kp_s_r4b_fp16.onnx" corners.onnx
          get "$HF/maxhille/mtg-gallery-creator/resolve/main/gallery/gallery_ids.json" gallery_ids.json
          python3 .github/scripts/scan_samples.py scan-models 30 app/src/test/resources/scan-photos

      - name: Compare
        continue-on-error: true
        run: python3 .github/scripts/compare_models.py scan-models 300 model-compare.md

      - name: Report
        if: always()
        run: cat model-compare.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report" >> "$GITHUB_STEP_SUMMARY"
