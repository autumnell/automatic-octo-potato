name: probe-spellbook
on:
  push:
    branches: [claude/deck-insights]
    paths: [.github/workflows/probe-spellbook.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSI -A "Grimoire-app" https://json.commanderspellbook.com/variants.json | grep -iE "^(HTTP|content-length|content-type|content-encoding|last-modified)"
          curl -sS -A "Grimoire-app" -H "Accept-Encoding: gzip" https://json.commanderspellbook.com/variants.json -o v.gz -w "status %{http_code} size %{size_download}\n"
          ls -la v.gz; file v.gz
          (gunzip -c v.gz 2>/dev/null || cat v.gz) > v.json; ls -la v.json
          python3 - <<'PY'
          import json
          d=json.load(open('v.json'))
          print(type(d).__name__, list(d.keys())[:10] if isinstance(d,dict) else len(d))
          vs=d['variants'] if isinstance(d,dict) and 'variants' in d else d
          print('n',len(vs)); print(json.dumps(vs[0])[:1500])
          from collections import Counter
          print(Counter(len(v.get('uses',[])) for v in vs).most_common(8))
          print('status', Counter(v.get('status') for v in vs))
          PY
