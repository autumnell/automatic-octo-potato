name: probe-spellbook
on:
  push:
    branches: [claude/deck-insights]
    paths: [.github/workflows/probe-spellbook.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for c in atraxa-praetors-voice the-ur-dragon edgar-markov krenko-mob-boss yuriko-the-tigers-shadow kenrith-the-returned-king muldrotha-the-gravetide meren-of-clan-nel-toth lathril-blade-of-the-elves miirym-sentinel-wyrm korvold-fae-cursed-king prossh-skyraider-of-kher sythis-harvests-hand niv-mizzet-parun chulane-teller-of-tales; do
            curl -sS -A "Grimoire-app" https://json.edhrec.com/pages/commanders/$c.json -o $c.json
          done
          python3 - <<'PY'
          import json,glob,time,urllib.request
          names=set()
          for f in glob.glob('*.json'):
              try: d=json.load(open(f))
              except Exception: continue
              for l in d.get('container',{}).get('json_dict',{}).get('cardlists',[]):
                  for c in l.get('cardviews',[]): names.add(c['name'])
          names=sorted(names); print('names',len(names))
          for n in [300,1000,len(names)]:
              body=json.dumps({"commanders":[],"main":[{"card":x,"quantity":1} for x in names[:n]]}).encode()
              req=urllib.request.Request("https://backend.commanderspellbook.com/find-my-combos",data=body,headers={"Content-Type":"application/json","User-Agent":"Grimoire-app"})
              t=time.time()
              try:
                  r=urllib.request.urlopen(req,timeout=60); d=json.load(r)
                  res=d.get('results',{})
                  print(n,'status',r.status,'secs',round(time.time()-t,1),{k:len(v) for k,v in res.items() if isinstance(v,list)}, 'count' ,d.get('count'), 'next', d.get('next'))
                  if res.get('included'): print(json.dumps(res['included'][0])[:400])
              except Exception as e: print(n,'error',e, getattr(e,'read',lambda:b'')()[:300])
          PY
