name: Old database layouts

# One-off: rebuilds the database layout (Room schema JSON) of every past database version from the commit that
# last used it, and commits them to app/schemas so the upgrade test can start from each one. Runs when this file
# changes on a branch; does nothing if every layout is already there.
on:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/schemas.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build each old layout
        run: |
          set -u
          out=app/schemas/com.mtgscanner.data.db.AppDatabase
          mkdir -p "$out"
          db=app/src/main/java/com/mtgscanner/data/db/AppDatabase.kt
          current=$(grep -oE 'version = [0-9]+' "$db" | head -1 | grep -oE '[0-9]+')
          for n in $(seq 1 "$current"); do
            [ -f "$out/$n.json" ] && continue
            if [ "$n" = "$current" ]; then
              commit=HEAD
            else
              # The commit that moved to version n+1; the layout for n is just before it.
              bump=$(git log --format=%H -G"version = $((n + 1))," -- "$db" | tail -1)
              commit="$bump^"
            fi
            echo "::group::Version $n from $(git rev-parse --short "$commit")"
            rm -rf /tmp/old && git worktree add -f /tmp/old "$commit"
            (cd /tmp/old && ./gradlew --no-daemon -q :app:kspDebugKotlin) || echo "Version $n failed"
            if [ -f "/tmp/old/$out/$n.json" ]; then cp "/tmp/old/$out/$n.json" "$out/"; else echo "No layout for $n"; ls -R /tmp/old/app/schemas || true; fi
            git worktree remove -f /tmp/old
            echo "::endgroup::"
          done
          ls -la "$out"

      - name: Commit the layouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Add the database layout of every past version"
          git push origin HEAD:${{ github.ref_name }}
